version: '3.9'

services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mogu_api
    ports:
      - '3001:3001'
    env_file:
      - .env.local
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mogu_net
    restart: unless-stopped

  # ── Redis (BullMQ — thêm sau) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mogu_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mogu_net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  mogu_net:
    driver: bridge
