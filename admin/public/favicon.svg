<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Golden background circle -->
  <circle cx="50" cy="50" r="48" fill="#FFC928"/>
  <!-- Dark border -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#2A1A10" stroke-width="4"/>
  <!-- Nón lá -->
  <polygon points="50,14 26,42 74,42" fill="#FFF7E8" stroke="#2A1A10" stroke-width="3" stroke-linejoin="round"/>
  <line x1="50" y1="14" x2="50" y2="42" stroke="#E5DEC9" stroke-width="2"/>
  <!-- Horns -->
  <path d="M28 38 C20 34 16 26 22 22 C26 26 30 33 34 38 Z" fill="#2A1A10"/>
  <path d="M72 38 C80 34 84 26 78 22 C74 26 70 33 66 38 Z" fill="#2A1A10"/>
  <!-- Calf face -->
  <ellipse cx="50" cy="56" rx="26" ry="24" fill="#FFC928" stroke="#2A1A10" stroke-width="3"/>
  <!-- Ears -->
  <ellipse cx="22" cy="52" rx="10" ry="6" fill="#FFC928" stroke="#2A1A10" stroke-width="2.5"/>
  <ellipse cx="22" cy="52" rx="6" ry="3.5" fill="#FFA590"/>
  <ellipse cx="78" cy="52" rx="10" ry="6" fill="#FFC928" stroke="#2A1A10" stroke-width="2.5"/>
  <ellipse cx="78" cy="52" rx="6" ry="3.5" fill="#FFA590"/>
  <!-- Eyes -->
  <ellipse cx="40" cy="50" rx="3.5" ry="4.5" fill="#2A1A10"/>
  <circle cx="41.5" cy="48" r="1.5" fill="#FFFFFF"/>
  <ellipse cx="60" cy="50" rx="3.5" ry="4.5" fill="#2A1A10"/>
  <circle cx="61.5" cy="48" r="1.5" fill="#FFFFFF"/>
  <!-- Blush -->
  <ellipse cx="33" cy="57" rx="3.5" ry="2" fill="#FF725E" opacity="0.8"/>
  <ellipse cx="67" cy="57" rx="3.5" ry="2" fill="#FF725E" opacity="0.8"/>
  <!-- Muzzle -->
  <ellipse cx="50" cy="64" rx="13" ry="8" fill="#B08D79" stroke="#2A1A10" stroke-width="2"/>
  <!-- Nostrils -->
  <ellipse cx="45" cy="63" rx="1.8" ry="1.4" fill="#2A1A10"/>
  <ellipse cx="55" cy="63" rx="1.8" ry="1.4" fill="#2A1A10"/>
  <!-- Smile -->
  <path d="M46 68 Q50 72 54 68" fill="none" stroke="#2A1A10" stroke-width="2" stroke-linecap="round"/>
</svg>
